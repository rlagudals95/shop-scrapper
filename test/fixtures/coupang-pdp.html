<!DOCTYPE html>
<html>
<head>
  <title>Samsung Galaxy S24 Ultra - Coupang</title>
</head>
<body>
  <div class="product-detail">
    <div class="product-header">
      <span class="brand">Samsung</span>
      <h1 class="product-title">Samsung Galaxy S24 Ultra 256GB Titanium Black</h1>
    </div>

    <div class="product-price">
      <span class="sale-price">1,299,000원</span>
      <span class="original-price">1,450,000원</span>
    </div>

    <div class="product-description">
      <p>최신 갤럭시 AI 기능이 탑재된 삼성 플래그십 스마트폰.
      200MP 카메라, S펜 지원, 티타늄 프레임 적용.</p>
    </div>

    <div class="product-options">
      <select class="option-select" id="colorOption">
        <option value="black">Titanium Black</option>
        <option value="gray">Titanium Gray</option>
        <option value="violet">Titanium Violet</option>
        <option value="yellow">Titanium Yellow</option>
      </select>
      <select class="option-select" id="storageOption">
        <option value="256">256GB</option>
        <option value="512">512GB</option>
        <option value="1tb">1TB</option>
      </select>
    </div>

    <div class="detail-images">
      <img src="https://example.com/detail/detail1.jpg" alt="Detail 1">
      <img src="https://example.com/detail/detail2.jpg" alt="Detail 2">
      <img src="https://example.com/detail/detail3.jpg" alt="Detail 3">
    </div>
  </div>
</body>
</html>
